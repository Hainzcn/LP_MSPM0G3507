version: "4.1"
name: LP_MSPM0G3507
type: ARM
deviceName: MSPM0G3507
packDir: .pack/TexasInstruments/MSPM0G1X0X_G3X0X_DFP.1.3.1
srcDirs:
  - ../template
  - ../template/hardware
  - ../template/middle
  - ../template/app
  - ../template/keil
virtualFolder:
  name: <virtual_root>
  files:
    - path: ./LP_MSPM0G3507.syscfg
    - path: ./ti_msp_dl_config.c
    - path: ./ti_msp_dl_config.h
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 23eace12a8d7d1a542edbc45d0264067
targets:
  LP_MSPM0G3507:
    cppPreprocessAttrs:
      defineList:
        - __MSPM0G3507__
      incList:
        - .
        - A:/ti/mspm0_sdk_2_10_00_04/source
        - A:/ti/mspm0_sdk_2_10_00_04/source/third_party/CMSIS/Core/Include
        - ../template/hardware
        - ../template/middle
        - ../template/app
        - ../template/keil/RTE/_LP_MSPM0G3507
      libList: []
    excludeList:
      # Stage 2.2 上车基线：排除与 app_balance_run() 互斥的旧主循环模块
      #   - app_motor_demo: Stage 2.0/2.1 演示固件，与 balance 共用 S1 toggle / set_output
      #   - app_telemetry : Stage 1.6 IMU 遥测，自带 for(;;) 主循环（已被 app_balance_run 吸收）
      # 排除路径 = <虚拟分组>/<文件名>，分组名 = srcDirs 扫描的目录最后一级
      - <virtual_root>/app/app_motor_demo.c
      - <virtual_root>/app/app_telemetry.c
    settings:
      debugger: cortex-debug
    toolchain: AC6
    toolchainConfigMap:
      AC6:
        archExtensions: ""
        cpuType: Cortex-M0+
        floatingPointHardware: none
        options:
          version: 3
          afterBuildTasks: []
          asm-compiler:
            $use: asm-auto
          beforeBuildTasks:
            - name: check working directory
              abortAfterFailed: false
              command: 'cmd /c "echo Working directory: %CD%"'
              disable: false
              stopBuildAfterFailed: false
            - name: linking syscfg
              abortAfterFailed: true
              command: '"${projectRoot}/syscfg.bat" "${projectRoot}" LP_MSPM0G3507.syscfg'
              disable: false
              stopBuildAfterFailed: true
          c/cpp-compiler:
            language-c: c99
            language-cpp: c++11
            one-elf-section-per-function: true
            optimization: level-2
            short-enums#wchar: true
            warnings: misra-compatible
          global:
            output-debug-info: enable
          linker:
            misc-controls: A:/ti/mspm0_sdk_2_10_00_04/source/ti/driverlib/lib/keil/m0p/mspm0g1x0x_g3x0x/driverlib.a
            output-format: elf
        scatterFilePath: ../template/keil/mspm0g3507.sct
        storageLayout:
          RAM:
            - id: 1
              isChecked: false
              mem:
                size: "0x8000"
                startAddr: "0x20200000"
              noInit: false
              tag: RAM
            - id: 2
              isChecked: false
              mem:
                size: "0x8000"
                startAddr: "0x20300000"
              noInit: false
              tag: RAM
            - id: 3
              isChecked: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              noInit: false
              tag: RAM
            - id: 1
              isChecked: false
              mem:
                size: "0x8000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
            - id: 2
              isChecked: false
              mem:
                size: "0x8000"
                startAddr: "0x20100000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: false
              isStartup: true
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 2
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 3
              isChecked: false
              isStartup: false
              mem:
                size: "0x0"
                startAddr: "0x0"
              tag: ROM
            - id: 1
              isChecked: false
              isStartup: false
              mem:
                size: "0x20000"
                startAddr: "0x0"
              tag: IROM
            - id: 2
              isChecked: false
              isStartup: false
              mem:
                size: "0x20000"
                startAddr: "0x400000"
              tag: IROM
        useCustomScatterFile: true
    uploadConfigMap:
      Custom:
        bin: ""
        commandLine: '"A:/ti/uniflash_9.5.0/dslite.bat" --config="A:/ti/uniflash_9.5.0/user_files/configs/MSPM0G3507.ccxml" -e -f -v "${ExecutableName}.axf"'
        eraseChipCommand: '"A:/ti/uniflash_9.5.0/dslite.bat" --config="A:/ti/uniflash_9.5.0/user_files/configs/MSPM0G3507.ccxml" -e'
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      probe-rs:
        allowEraseAll: false
        baseAddr: "0x08000000"
        bin: ""
        otherOptions: ""
        protocol: swd
        speed: 0
        target: STM32F103C8
    uploader: Custom
